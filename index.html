<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapstoneHub | University Capstone Management System</title>
<link rel="icon" type="image/png" href="../LOGO/logo0.1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>


  :root {
    --color-white: #ffffff;
    --color-offwhite: #f8f9fa;
    --color-border: #e0e0e0;
    --color-text-primary: #202124;
    --color-text-secondary: #5f6368;
    --color-text-muted: #80868b;

    --blue: #4285F4;
    --red: #EA4335;
    --yellow: #FBBC05;
    --green: #34A853;

    --blue-tint: #e8f0fe;
    --red-tint: #fce8e6;
    --yellow-tint: #fef7e0;
    --green-tint: #e6f4ea;

    --navbar-height: 64px;
    --sidebar-width: 240px;
    --radius-sm: 4px;
    --radius-md: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Roboto', system-ui, -apple-system, sans-serif;
    color: var(--color-text-primary);
    background-color: var(--color-white);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .hidden { display: none !important; }


  .bg-decoration {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .bg-shape {
    position: absolute;
    opacity: 0.05;
  }

  .shape-circle { border-radius: 50%; }
  .shape-square { border-radius: var(--radius-sm); }

  .shape-1 { width: 220px; height: 220px; background: var(--blue); top: 8%; left: 6%; animation: drift-a 34s ease-in-out infinite; }
  .shape-2 { width: 160px; height: 160px; background: var(--red); top: 60%; left: 82%; animation: drift-b 28s ease-in-out infinite; }
  .shape-3 { width: 130px; height: 130px; background: var(--yellow); top: 78%; left: 12%; animation: drift-c 40s ease-in-out infinite; }
  .shape-4 { width: 190px; height: 190px; background: var(--green); top: 20%; left: 88%; animation: drift-a 32s ease-in-out infinite reverse; }
  .shape-5 { width: 100px; height: 100px; background: var(--blue); top: 40%; left: 46%; animation: drift-b 45s linear infinite; }

  @keyframes drift-a {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(30px, 40px) rotate(15deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes drift-b {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(-35px, 25px) rotate(-12deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes drift-c {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(20px, -30px) rotate(10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-shape { animation: none !important; }
  }

  /* 3. SCREEN A — LOGIN PAGE */
  .login-screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--color-white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 40px 36px;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 8px;
  }

  .brand-mark {
    width: 50px;
    height: 50px;
    object-fit: contain;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .login-subtitle {
    text-align: center;
    color: var(--color-text-secondary);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .form-group { margin-bottom: 18px; }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--color-text-primary);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-white);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .form-input:focus {
    border-color: var(--blue);
  }

  .form-row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 13px;
  }

  .form-check {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--color-text-secondary);
  }

  .form-link {
    color: var(--blue);
    text-decoration: none;
  }
  .form-link:hover { text-decoration: underline; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .btn-primary {
    width: 100%;
    padding: 11px 16px;
    background: var(--blue);
    color: var(--color-white);
  }
  .btn-primary:hover { background: #3367d6; }

  .btn-outline {
    background: var(--color-white);
    color: var(--color-text-secondary);
    border-color: var(--color-border);
    padding: 7px 12px;
    font-size: 13px;
  }
  .btn-outline:hover { background: var(--color-offwhite); border-color: #c0c0c0; }

  .login-footnote {
    text-align: center;
    margin-top: 20px;
    font-size: 12.5px;
    color: var(--color-text-muted);
  }

  /* 4. SCREEN B — STUDENT DASHBOARD */
  .dashboard-screen {
    position: relative;
    z-index: 1;
  }

  /* --- Top Navigation Bar --- */
  .top-navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--navbar-height);
    background: var(--color-white);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
  }

  .navbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 200px;
  }

  .hamburger-btn {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hamburger-btn:hover { background: var(--color-offwhite); }

  .navbar-search {
    flex: 1;
    display: flex;
    justify-content: center;
  }

  .search-input-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .search-input {
    width: 100%;
    padding: 9px 14px 9px 38px;
    font-family: inherit;
    font-size: 14px;
    background: var(--color-offwhite);
    border: 1px solid transparent;
    border-radius: 20px;
    outline: none;
    color: var(--color-text-primary);
  }

  .search-input:focus {
    background: var(--color-white);
    border-color: var(--color-border);
  }

  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-muted);
    pointer-events: none;
  }

  .navbar-right {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 200px;
    justify-content: flex-end;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    position: relative;
  }
  .icon-btn:hover { background: var(--color-offwhite); }

  .notif-dot {
    position: absolute;
    top: 7px;
    right: 8px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    border: 1.5px solid var(--color-white);
  }

  .user-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--blue);
    color: var(--color-white);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* --- Sidebar --- */
  .sidebar {
    position: fixed;
    top: var(--navbar-height);
    left: 0;
    bottom: 0;
    width: var(--sidebar-width);
    background: var(--color-offwhite);
    border-right: 1px solid var(--color-border);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 200;
    overflow-y: auto;
    transition: transform 0.25s ease;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    top: var(--navbar-height);
    left: 0; right: 0; bottom: 0;
    background: rgba(32, 33, 36, 0.4);
    z-index: 150;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .sidebar-overlay.visible {
    display: block;
    opacity: 1;
  }

  .sidebar-menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .sidebar-link:hover {
    background: #eef1f4;
    color: var(--color-text-primary);
  }

  .sidebar-link.active {
    background: var(--blue-tint);
    color: var(--blue);
  }

  .sidebar-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sidebar-footer {
    border-top: 1px solid var(--color-border);
    padding-top: 12px;
  }

  /* --- Main Content --- */
  .main-content {
    margin-top: var(--navbar-height);
    margin-left: var(--sidebar-width);
    padding: 32px 36px 60px;
    min-height: calc(100vh - var(--navbar-height));
  }

  .breadcrumbs {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-bottom: 6px;
  }

  .breadcrumbs .current { color: var(--color-text-secondary); }

  .welcome-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .welcome-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .welcome-sub {
    font-size: 13.5px;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }

  /* --- Panels / Cards --- */
  .panel {
    background: var(--color-white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 22px 24px;
    margin-bottom: 24px;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .panel-title {
    font-size: 15px;
    font-weight: 700;
  }

  .panel-link {
    font-size: 13px;
    color: var(--blue);
    text-decoration: none;
    font-weight: 500;
  }
  .panel-link:hover { text-decoration: underline; }

  /* --- Progress Bar Component --- */
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .progress-phase-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
  }

  .progress-percent {
    font-size: 20px;
    font-weight: 700;
    color: var(--green);
  }

  .progress-track {
    width: 100%;
    height: 10px;
    background: var(--color-offwhite);
    border-radius: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 20px;
    width: 75%;
    transition: width 0.4s ease;
  }

  .progress-milestones {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 12px;
    color: var(--color-text-muted);
  }

  .progress-milestones .done { color: var(--green); font-weight: 500; }
  .progress-milestones .current { color: var(--blue); font-weight: 500; }

  /* --- Data Table --- */
  .table-container { overflow-x: auto; }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  .data-table thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--color-text-muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--color-border);
    white-space: nowrap;
  }

  .data-table tbody td {
    padding: 14px 12px;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-text-primary);
    vertical-align: middle;
  }

  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover { background: var(--color-offwhite); }

  .file-cell {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .file-icon {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: var(--blue-tint);
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-name { font-weight: 500; }
  .file-sub { font-size: 12px; color: var(--color-text-muted); }

  /* Status Badges */
  .status-badge {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .status-approved { background: var(--green-tint); color: #1e8e3e; }
  .status-revision { background: var(--red-tint); color: #c5221f; }
  .status-pending  { background: var(--yellow-tint); color: #b06000; }

  .action-buttons {
    display: flex;
    gap: 8px;
  }

  .action-btn {
    background: var(--color-white);
    border: 1px solid var(--color-border);
    color: var(--color-text-secondary);
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .action-btn:hover { background: var(--color-offwhite); border-color: #c0c0c0; }

  /* --- Secondary grid: stats + deadline --- */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--color-white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
  }

  .stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .stat-icon {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
  }

  .stat-label {
    font-size: 12.5px;
    color: var(--color-text-secondary);
    margin-top: 2px;
  }


  @media (max-width: 1024px) {
    .info-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 900px) {
    .hamburger-btn { display: flex; }
    .navbar-left { min-width: auto; }

    .sidebar { transform: translateX(-100%); box-shadow: none; }
    .sidebar.sidebar-open { transform: translateX(0); }

    .main-content { margin-left: 0; }
  }

  @media (max-width: 640px) {
    .navbar-search { display: none; }
    .main-content { padding: 24px 16px 48px; }

    .welcome-header { align-items: flex-start; }
    .welcome-title { font-size: 20px; }

    .info-grid { grid-template-columns: 1fr; gap: 12px; }
    .panel { padding: 18px; }
  }

  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; }

    /* Recent Submissions: table -> stacked cards */
    .data-table thead { display: none; }
    .data-table, .data-table tbody, .data-table tr, .data-table td {
      display: block;
      width: 100%;
    }
    .data-table tr {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      padding: 4px 12px;
    }
    .data-table tr:last-child { margin-bottom: 0; }
    .data-table td {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-border);
      text-align: right;
    }
    .data-table td:last-child { border-bottom: none; }
    .data-table td::before {
      content: attr(data-label);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      text-align: left;
      flex-shrink: 0;
    }
    .data-table td[data-label="Filename"] .file-cell { flex: 1; justify-content: flex-end; }
    .data-table td[data-label="Filename"]::before { align-self: center; }
  }

</style>
</head>
<body>

  <!-- Ambient background decoration: flat, low-opacity shapes -->
  <div class="bg-decoration" aria-hidden="true">
    <div class="bg-shape shape-circle shape-1"></div>
    <div class="bg-shape shape-square shape-2"></div>
    <div class="bg-shape shape-circle shape-3"></div>
    <div class="bg-shape shape-square shape-4"></div>
    <div class="bg-shape shape-circle shape-5"></div>
  </div>

  <!-- SCREEN A: LOGIN PAGE -->
  <main class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-brand">
       <img src="../LOGO/logo0.1.png" alt="CapstoneHub logo" class="brand-mark">
      </div>
      <p class="login-subtitle">University Capstone Management System</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="studentId">School Email</label>
          <input class="form-input" type="email" id="studentId" placeholder="juan.delacruz@university.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-row-between">
          <label class="form-check">
            <input type="checkbox" id="rememberMe">
            Remember me
          </label>
          <a href="#" class="form-link">Forgot password?</a>
        </div>

       <a href="dashboard.html" class="btn btn-primary" id="loginBtn">Log In</a>
       
      </form>

      <p class="login-footnote">Access is limited to enrolled students and faculty advisers.</p>
    </div>
  </main>


</body>
</html>
